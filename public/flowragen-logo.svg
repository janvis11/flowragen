<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Center circle -->
  <circle cx="20" cy="20" r="4" fill="#FF6B9D"/>
  
  <!-- Petals -->
  <ellipse cx="20" cy="10" rx="4" ry="7" fill="#FF8FAB" opacity="0.9"/>
  <ellipse cx="20" cy="30" rx="4" ry="7" fill="#FF8FAB" opacity="0.9"/>
  <ellipse cx="10" cy="20" rx="7" ry="4" fill="#FFA8C5" opacity="0.9"/>
  <ellipse cx="30" cy="20" rx="7" ry="4" fill="#FFA8C5" opacity="0.9"/>
  
  <!-- Diagonal petals -->
  <ellipse cx="14" cy="14" rx="4" ry="6" fill="#FFB8D1" opacity="0.85" transform="rotate(-45 14 14)"/>
  <ellipse cx="26" cy="26" rx="4" ry="6" fill="#FFB8D1" opacity="0.85" transform="rotate(-45 26 26)"/>
  <ellipse cx="26" cy="14" rx="4" ry="6" fill="#FFC4DC" opacity="0.85" transform="rotate(45 26 14)"/>
  <ellipse cx="14" cy="26" rx="4" ry="6" fill="#FFC4DC" opacity="0.85" transform="rotate(45 14 26)"/>
  
  <!-- Decorative dots -->
  <circle cx="20" cy="6" r="1.5" fill="#FF6B9D"/>
  <circle cx="20" cy="34" r="1.5" fill="#FF6B9D"/>
  <circle cx="6" cy="20" r="1.5" fill="#FF6B9D"/>
  <circle cx="34" cy="20" r="1.5" fill="#FF6B9D"/>
</svg>
